labels_summary: |
  Per-response judge labels for every CASTOR model on {n_prompts} public benchmark prompts ({n_samples} samples
  and one greedy response each, `sample` = -1 is the greedy response). Prompts are referenced by
  benchmark id only; no prompt text and no model generations are included.

labels_truncated: |
  One response was cut to fit the judges' context: the greedy response (`sample` = -1) of
  `dd-dolma1_7-no-math-code-1b-large-aux-3-dpo-seed1` to `wildjailbreak-00287`. WildGuard returned
  no label for it (`JUDGE-ERROR`); Qwen3Guard labelled the cut response. Every other label is on
  the full response.
