# Model card and dataset README text. DRAFT: approved by the authors at the release review gate.
tags: [castor, safety, refusal, jailbreak, seed-twins, datadecide]

summary: |
  Part of CASTOR, a set of seed-twinned language models: DataDecide base models that differ only
  in their pretraining seed, each given the same safety post-training (SFT then DPO, the OLMo 2
  1B Instruct recipe) under several post-training seeds. The set is built to measure how much
  of a model's per-prompt jailbreak vulnerability its pretraining seed determines.

castor_base_note: |
  This base is not on the Hub.

evaluation: |
  Each model answered {n_prompts} public benchmark prompts (HarmBench, HarmBench human jailbreaks,
  WildJailbreak, StrongREJECT, SORRY-Bench, XSTest, OR-Bench), {n_samples} sampled responses and one greedy
  response per prompt. Every response was labelled by WildGuard and Qwen3Guard. The per-response
  labels for every model are in [`{labels_repo}`](https://huggingface.co/datasets/{labels_repo}),
  keyed by benchmark prompt id. Generations are not released.

intended_use: |
  Research on how pretraining and post-training randomness shape safety behaviour, refusal and
  jailbreak robustness. These are small research models; they are not assistants and are not
  suitable for deployment.

safety: |
  The models were safety-tuned on public data, and their bases are public. They can still produce
  harmful text when prompted, as the released labels show. Model outputs on harmful prompts are
  not released.

license:
  weights: apache-2.0
  labels: odc-by
  text: |
    Apache 2.0, as the DataDecide base models. The post-training data are released by Ai2 under
    ODC-BY 1.0, with some subsets under other licences.

