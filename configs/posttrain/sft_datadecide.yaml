# SFT for DataDecide twins, variant A (D020): no BOS.
# Identical to sft_olmo2_1b.yaml except: tokenizer/BOS (D020 vs variant B, /direct decides) and
# max_seq_length 2048 (D020: DataDecide pretrained at 2048, RoPE theta 1e4; open-instruct right-truncates).
# Launch: as sft_olmo2_1b.yaml (stage 3, 8 GPUs). model_name_or_path = converted twin dir (D021 e).
add_bos: false               # D020: the NeoX tokenizer has no BOS
# tokenizer = the checkpoint's own (converted DataDecide tokenizer, or the SFT twin's)
use_slow_tokenizer: false
dataset_mixer_list: [/work/harrychang08/castor/data/tulu3/jsonl/tulu-3-sft-olmo-2-mixture-0225@d91a0785ade0.jsonl, "1.0"]
use_flash_attn: true
max_seq_length: 2048
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 3.0e-05
lr_scheduler_type: linear
warmup_ratio: 0.03
weight_decay: 0.0
num_train_epochs: 2
reduce_loss: sum
logging_steps: 1
# --- castor I/O and logging (no effect on training; see notes/004 "config diff") ---
with_tracking: false          # Ai2: true + wandb. Loss is logged to stdout every step regardless (finetune.py:838-840); curves parsed from the Slurm log
push_to_hub: false            # Ai2 default true (uploads to their HF org)
try_launch_beaker_eval_jobs: false
try_auto_save_to_beaker: false
dataset_local_cache_dir: /work/harrychang08/castor/cache/open_instruct_datasets
# model_name_or_path, seed, output_dir, exp_name: filled per run by shell/posttrain/train.sh
